name: 資料同步與部署

on:
  schedule:
    - cron: '0 20 * * *' # 每日台灣時間 04:00 執行一次
  workflow_dispatch: {}
  push:
    branches: [main]

# 不設定 workflow 層級的 concurrency：先前用 cancel-in-progress: false 時，
# 只要有一個 run 卡在 queued（GitHub 端偶發問題），後面所有 run 都會排在它後面永遠不會開始。

# 快照步驟要 git push 回 main，需要寫入權限（新 repo 預設 GITHUB_TOKEN 只有讀取權限）
permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      # 資料同步 + 快照只在「每日排程 / 手動觸發」時跑。
      # push（包含 /admin 後台每次存檔產生的 commit）只需要 build + 部署，
      # 否則每存一次檔就多一份空快照 commit。
      - run: npm run sync-data
        if: github.event_name != 'push'
        env:
          # 讀取用的官方 API key（僅查詢，不做寫入）
          DATA_SOURCE_API_KEY: ${{ secrets.DATA_SOURCE_API_KEY }}

      # 每次同步都是新增快照檔案，不覆蓋歷史 —— 見 scripts/fetch-data.mjs 的說明
      - name: 提交新的資料快照
        if: github.event_name != 'push'
        run: |
          git config user.name "food-site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data-snapshots
          git diff --cached --quiet || git commit -m "chore: 資料快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # main 在 checkout 之後、push 之前可能已經有其他 commit（例如手動 push，或另一次排程執行）
          # 推送前先 rebase 到最新的 main，避免 non-fast-forward 被拒絕、導致後面 build／部署被跳過。
          # --autostash 保護萬一 working tree 還有未加入 commit 的變動；重試 3 次因應短時間內連續觸發的情況。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && break
            echo "git pull --rebase 失敗，第 $i 次重試..." >&2
            sleep $((i * 5))
          done
          git push

      # build 會先產生 /admin 設定檔、執行資料交叉驗證（scripts/validate-content.mjs），驗證失敗就不部署
      - run: npm run build
        env:
          # /admin 的 GitHub OAuth 登入 Worker 網址，在 repo Settings → Variables 設定（沒設定時後台用 Token 登入）
          CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}

      # cloudflare/pages-action 已下架（2026-09 起 workflow 在 Set up job 就失敗），改用官方 wrangler-action
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=twfood --branch=main --commit-dirty=true
