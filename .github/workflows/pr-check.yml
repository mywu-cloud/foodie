name: 投稿 / PR 檢查

# 在 PR 上跑資料驗證與 build（/user 投稿已改走 /admin「投稿審核」，這裡留給手動開的 PR）。
# 審查者在 PR 頁面就能看到投稿資料是否正確（縣市／鄉鎮區對應、分類、照片存在與大小）。不部署、不需要 secrets。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
