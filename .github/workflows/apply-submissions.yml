name: 投稿審核

# /user 投稿存在 submissions/ 收件匣。編輯在 /admin「投稿審核」把狀態改成「核准上線」或「退件」並存檔後，
# 這個 workflow 會執行 scripts/apply-submissions.mjs：
#   核准 → 寫入店家資料、照片搬到 public/、驗證通過後刪除投稿 → 觸發部署
#   退件 → 刪除投稿與照片
#   驗證沒過 → 那一筆退回「待審核」，錯誤寫在 reviewError（後台看得到）
on:
  push:
    branches: [main]
    paths: ['submissions/**']
  workflow_dispatch: {}

permissions:
  contents: write # commit 審核結果
  actions: write  # 觸發部署 workflow

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 處理核准／退件
        id: run
        run: |
          node scripts/apply-submissions.mjs | tee /tmp/apply.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/apply.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "result=$(grep -o 'RESULT=.*' /tmp/apply.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: 提交結果
        run: |
          git config user.name "food-site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A submissions src/content public/images/restaurants
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -q -m "content: 投稿審核結果 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && break
            sleep $((i * 5))
          done

      # GITHUB_TOKEN 推送的 commit 不會觸發其他 workflow，所以這裡主動觸發部署
      - name: 觸發部署
        if: steps.run.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data-update.yml --ref main
